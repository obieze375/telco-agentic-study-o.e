services:
  server:
    build: .
    image: track-a:latest
    container_name: track-a-server
    command: ["server"]
    ports:
      - "${TRACK_A_PORT:-7860}:7860"
    environment:
      FASTAPI_HOST: 0.0.0.0
      FASTAPI_PORT: 7860
      UVICORN_RELOAD: "false"
      DATA_SOURCE: ${DATA_SOURCE:-data/Phase_1}
      DATA_SPLIT: ${DATA_SPLIT:-test}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7860/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  agent:
    build: .
    image: track-a:latest
    container_name: track-a-agent
    profiles: ["agent"]
    depends_on:
      server:
        condition: service_healthy
    command:
      - agent
      - --server_url
      - http://server:7860
      - --model_url
      - ${MODEL_URL:-https://api.tokenfactory.nebius.com/v1}
      - --model_name
      - ${MODEL_NAME:-Qwen/Qwen3-30B-A3B-Instruct-2507}
      - --max_samples
      - ${MAX_SAMPLES:-1}
      - --save_dir
      - /app/results
      - --verbose
    environment:
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
    volumes:
      - ./results:/app/results
    restart: "no"
